name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.signing
          key: signing-key-v1

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            # Secrets 가 없으면 키를 한 번 생성해 Actions 캐시에 보관하고 이후 빌드에서 재사용한다.
            mkdir -p ~/.signing
            if [ ! -f ~/.signing/release.jks ]; then
              openssl rand -hex 16 > ~/.signing/pw
              keytool -genkeypair -keystore ~/.signing/release.jks -storetype PKCS12 \
                -storepass "$(cat ~/.signing/pw)" -keypass "$(cat ~/.signing/pw)" \
                -alias bgtube -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=BgTube, O=Personal"
              echo "::warning::서명 키를 새로 만들었습니다. 이전에 설치한 앱과 서명이 달라 한 번은 삭제 후 재설치가 필요합니다."
            fi
            PW="$(cat ~/.signing/pw)"
            echo "::add-mask::$PW"
            echo "ANDROID_KEYSTORE_FILE=$HOME/.signing/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=bgtube" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Resolve GeckoView (arm64)
        id: gecko
        run: .github/scripts/resolve-gecko.sh arm64-v8a | tee -a "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          ./gradlew --no-daemon assembleRelease
          -PgeckoArtifact=${{ steps.gecko.outputs.artifact }}
          -PgeckoVersion=${{ steps.gecko.outputs.version }}
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}
          -PupdateRepo=${{ github.repository }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "BgTube-$TAG.apk"
          gh release create "$TAG" "BgTube-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "BgTube $TAG" \
            --notes "GeckoView ${{ steps.gecko.outputs.version }} / commit ${GITHUB_SHA::7}"

      - name: Build download page
        run: .github/scripts/make-site.sh "v1.0.${{ github.run_number }}" app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
