name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (optional secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret 이 없어 debug 키로 서명합니다 (빌드마다 키가 달라 앱 내 업데이트 설치 불가)"
          fi

      - name: Resolve GeckoView (arm64)
        id: gecko
        run: .github/scripts/resolve-gecko.sh arm64-v8a | tee -a "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          ./gradlew --no-daemon assembleRelease
          -PgeckoArtifact=${{ steps.gecko.outputs.artifact }}
          -PgeckoVersion=${{ steps.gecko.outputs.version }}
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}
          -PupdateRepo=${{ github.repository }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "BgTube-$TAG.apk"
          gh release create "$TAG" "BgTube-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "BgTube $TAG" \
            --notes "GeckoView ${{ steps.gecko.outputs.version }} / commit ${GITHUB_SHA::7}"

      - name: Build download page
        run: .github/scripts/make-site.sh "v1.0.${{ github.run_number }}" app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
